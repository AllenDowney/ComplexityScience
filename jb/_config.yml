# Book settings
title: Complexity Science
author: Allen B. Downey

execute:
  execute_notebooks: force
  timeout: 300

repository:
  url: https://github.com/AllenDowney/ComplexityScience
  branch: master

html:
  baseurl: https://allendowney.github.io/ComplexityScience/
  use_repository_button: true
  # Page-view counter: one request per page view to greenteapress.com/gh.gif,
  # counted from the greenteapress.com access logs (GreenTeaPress scripts/log_report.py).
  # No cookies, no third party.
  extra_footer: |
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>

sphinx:
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    html_baseurl: https://allendowney.github.io/ComplexityScience/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://allendowney.github.io/ComplexityScience/
    ogp_site_name: Complexity Science
    ogp_image: https://greenteapress.com/wp/wp-content/uploads/2018/09/think_complexity_2e.jpg
    ogp_image_alt: Cover of Think Complexity by Allen B. Downey, the book the examples come from
    # the opening text is often boilerplate, so write meta descriptions per page instead
    ogp_enable_meta_description: false
